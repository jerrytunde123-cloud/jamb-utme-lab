<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users · JAMB UTME Lab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="side-brand-crest"><img src="/assets/jamb-crest.png" alt="JAMB" onerror="this.style.display='none'"></div>
        <div class="side-brand-text"><h2>JAMB<span>Lab</span></h2><small>Admin</small></div>
      </div>
      <div id="sideLinks"></div>
      <div class="side-foot">
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
        <div>v1.0 · UTME 2026</div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1><i class="fas fa-users"></i> Users</h1>
        <div class="topbar-actions">
          <input class="field-input" id="searchBox" placeholder="Search by User ID…" style="min-width:220px;">
          <button class="btn btn-muted" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fas fa-list"></i> Tracked users <span id="userCount" style="margin-left:auto;font-size:0.8rem;color:#6f8b9c;"></span></div>
        <div id="userList"><div class="empty-state"><span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:#1a5f7a;"></span></div></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/users.js"></script>
</body>
</html>
