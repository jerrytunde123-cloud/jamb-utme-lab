<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PINs · JAMB UTME Lab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="side-brand-crest"><img src="/assets/jamb-crest.png" alt="JAMB" onerror="this.style.display='none'"></div>
        <div class="side-brand-text"><h2>JAMB<span>Lab</span></h2><small>Admin</small></div>
      </div>
      <div id="sideLinks"></div>
      <div class="side-foot">
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
        <div>v1.0 · UTME 2026</div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1><i class="fas fa-key"></i> PIN Management</h1>
        <div class="topbar-actions">
          <a class="btn btn-muted" href="/api/admin/export-pins" download><i class="fas fa-file-export"></i> Export CSV</a>
          <button class="btn btn-success" id="saveBtn"><i class="fas fa-save"></i> Save Changes</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fas fa-magic"></i> Generate PINs</div>
        <div class="field-row">
          <div style="flex:1;"><div class="field-label">Points per PIN</div><input class="field-input" id="pinPoints" type="number" value="110" min="1"></div>
          <div style="flex:1;"><div class="field-label">Quantity</div><input class="field-input" id="pinCount" type="number" value="10" min="1" max="500"></div>
          <div style="flex:1;"><div class="field-label">Prefix</div><input class="field-input" id="pinPrefix" value="JAMB"></div>
          <button class="btn btn-primary" id="genBtn" style="align-self:flex-end;"><i class="fas fa-plus"></i> Generate</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fas fa-list"></i> All PINs <span id="pinStats" style="margin-left:auto;font-size:0.8rem;color:#6f8b9c;"></span></div>
        <div id="pinList"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/pins.js"></script>
</body>
</html>
